name: E2E

# Runs Playwright against the staging environment.
#
# Secrets required (set in Repo Settings → Secrets and variables → Actions):
#   E2E_BASE_URL          staging app URL, e.g. https://staging.lionheartapp.com
#   E2E_ORG_A_SLUG        primary test org slug
#   E2E_ORG_A_ID          primary test org UUID
#   E2E_ADMIN_EMAIL       admin-role user in Org A
#   E2E_ADMIN_PASSWORD
#   E2E_MEMBER_EMAIL      member-role user in Org A
#   E2E_MEMBER_PASSWORD
#   E2E_ORG_B_SLUG        (optional) second-org slug for isolation tests
#   E2E_ORG_B_ID
#   E2E_ORG_B_ADMIN_EMAIL
#   E2E_ORG_B_ADMIN_PASSWORD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override E2E_BASE_URL'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Shard browser-based suites for speed. API/permissions run in one shard.
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prisma generate
        run: npx prisma generate

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL }}
          E2E_ORG_A_SLUG: ${{ secrets.E2E_ORG_A_SLUG }}
          E2E_ORG_A_ID: ${{ secrets.E2E_ORG_A_ID }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_ORG_B_SLUG: ${{ secrets.E2E_ORG_B_SLUG }}
          E2E_ORG_B_ID: ${{ secrets.E2E_ORG_B_ID }}
          E2E_ORG_B_ADMIN_EMAIL: ${{ secrets.E2E_ORG_B_ADMIN_EMAIL }}
          E2E_ORG_B_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_B_ADMIN_PASSWORD }}
          # Never enable destructive / rate-limit tests in shared CI.
          E2E_ALLOW_SIGNUP: '0'
          E2E_TEST_RATE_LIMIT: '0'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge HTML reports
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          merge-multiple: true
          path: all-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: all-reports/
          retention-days: 30
