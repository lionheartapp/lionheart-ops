<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d6ded8" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .label{font:700 14px ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:#66736b}
      .title{font:700 24px ui-sans-serif,system-ui,sans-serif;fill:#07111f}
      .body{font:500 16px ui-sans-serif,system-ui,sans-serif;fill:#5f6b63}
      .small{font:700 12px ui-sans-serif,system-ui,sans-serif;fill:#6a756f}
      .card{fill:#fff;stroke:#dfe5e1;stroke-width:1.4;filter:url(#shadow)}
      .dark{fill:#07111f}
      .green{fill:#10b981}
      .blue{fill:#2563eb}
      .amber{fill:#f59e0b}
      .red{fill:#ef4444}
    </style>
  </defs>
    <rect width="1200" height="900" rx="56" fill="#f3f6f4"/>
    <rect width="1200" height="900" fill="url(#grid)" opacity="0.55"/>
    <rect x="72" y="70" width="1056" height="760" rx="44" fill="#fbfcfb" stroke="#dbe3de"/>
    
    <text x="120" y="134" class="label">Leo AI</text><text x="120" y="174" class="title">Grounded in the operations record</text>
    <rect x="140" y="260" width="410" height="400" rx="36" class="card"/>
    <text x="184" y="328" class="title" font-size="22">Ask Leo</text><text x="184" y="366" class="body">What changed for tonight?</text>
    <rect x="184" y="426" width="282" height="116" rx="24" fill="#eef3f0"/><text x="212" y="466" class="body">Found event conflict</text><text x="212" y="500" class="body">Drafted staff update</text>
    <rect x="650" y="246" width="390" height="430" rx="38" fill="#07111f" filter="url(#shadow)"/>
    <text x="704" y="316" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800" fill="#fff">Sources</text>
    <rect x="704" y="364" width="246" height="38" rx="14" fill="#1f2937"/><circle cx="728" cy="383" r="7" class="green"/><text x="750" y="389" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#d1d5db">Events</text><rect x="704" y="426" width="246" height="38" rx="14" fill="#1f2937"/><circle cx="728" cy="445" r="7" class="green"/><text x="750" y="451" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#d1d5db">Tickets</text><rect x="704" y="488" width="246" height="38" rx="14" fill="#1f2937"/><circle cx="728" cy="507" r="7" class="green"/><text x="750" y="513" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#d1d5db">Assets</text><rect x="704" y="550" width="246" height="38" rx="14" fill="#1f2937"/><circle cx="728" cy="569" r="7" class="green"/><text x="750" y="575" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#d1d5db">Forms</text>
    <path d="M550 462H650" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  </svg>