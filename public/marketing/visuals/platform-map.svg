<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d6ded8" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .label{font:700 14px ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:#66736b}
      .title{font:700 24px ui-sans-serif,system-ui,sans-serif;fill:#07111f}
      .body{font:500 16px ui-sans-serif,system-ui,sans-serif;fill:#5f6b63}
      .small{font:700 12px ui-sans-serif,system-ui,sans-serif;fill:#6a756f}
      .card{fill:#fff;stroke:#dfe5e1;stroke-width:1.4;filter:url(#shadow)}
      .dark{fill:#07111f}
      .green{fill:#10b981}
      .blue{fill:#2563eb}
      .amber{fill:#f59e0b}
      .red{fill:#ef4444}
    </style>
  </defs>
    <rect width="1200" height="900" rx="56" fill="#f3f6f4"/>
    <rect width="1200" height="900" fill="url(#grid)" opacity="0.55"/>
    <rect x="72" y="70" width="1056" height="760" rx="44" fill="#fbfcfb" stroke="#dbe3de"/>
    
    <text x="120" y="134" class="label">Platform</text>
    <text x="120" y="174" class="title">Shared operations map</text>
    <path d="M255 448H505M695 448H945M600 265V370M600 526V635" stroke="#a8b5ad" stroke-width="6" stroke-linecap="round"/>
    <circle cx="600" cy="448" r="92" class="dark" filter="url(#shadow)"/>
    <text x="557" y="438" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800" fill="#fff">Lionheart</text>
    <text x="547" y="468" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#b8c5bd">one workspace</text>
    <rect x="160" y="366" width="250" height="116" rx="26" class="card" fill="#e0f2fe"/><circle cx="202" cy="408" r="15" class="blue"/><text x="232" y="414" class="title" font-size="22">Events</text><text x="232" y="444" class="body">owner, status, context</text><rect x="842" y="366" width="250" height="116" rx="26" class="card" fill="#ecfdf5"/><circle cx="884" cy="408" r="15" class="green"/><text x="914" y="414" class="title" font-size="22">Tickets</text><text x="914" y="444" class="body">owner, status, context</text><rect x="160" y="530" width="250" height="116" rx="26" class="card" fill="#fff7ed"/><circle cx="202" cy="572" r="15" class="amber"/><text x="232" y="578" class="title" font-size="22">Forms</text><text x="232" y="608" class="body">owner, status, context</text><rect x="842" y="530" width="250" height="116" rx="26" class="card" fill="#f8fafc"/><circle cx="884" cy="572" r="15" class="dark"/><text x="914" y="578" class="title" font-size="22">Messages</text><text x="914" y="608" class="body">owner, status, context</text>
    <rect x="414" y="650" width="372" height="74" rx="22" fill="#eef3f0" stroke="#dbe3de"/>
