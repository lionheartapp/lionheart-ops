<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d6ded8" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .label{font:700 14px ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:#66736b}
      .title{font:700 24px ui-sans-serif,system-ui,sans-serif;fill:#07111f}
      .body{font:500 16px ui-sans-serif,system-ui,sans-serif;fill:#5f6b63}
      .small{font:700 12px ui-sans-serif,system-ui,sans-serif;fill:#6a756f}
      .card{fill:#fff;stroke:#dfe5e1;stroke-width:1.4;filter:url(#shadow)}
      .dark{fill:#07111f}
      .green{fill:#10b981}
      .blue{fill:#2563eb}
      .amber{fill:#f59e0b}
      .red{fill:#ef4444}
    </style>
  </defs>
    <rect width="1200" height="900" rx="56" fill="#f3f6f4"/>
    <rect width="1200" height="900" fill="url(#grid)" opacity="0.55"/>
    <rect x="72" y="70" width="1056" height="760" rx="44" fill="#fbfcfb" stroke="#dbe3de"/>
    
    <text x="120" y="134" class="label">Forms</text><text x="120" y="174" class="title">Submission to workflow</text>
    <rect x="142" y="246" width="354" height="480" rx="34" class="card"/>
    <text x="186" y="312" class="title" font-size="22">Field trip form</text>
    <rect x="186" y="364" width="242" height="42" rx="14" fill="#f8fafc" stroke="#dbe3de"/><circle cx="210" cy="385" r="7" class="green"/><text x="230" y="391" class="small">Guardian signature</text><rect x="186" y="436" width="242" height="42" rx="14" fill="#f8fafc" stroke="#dbe3de"/><circle cx="210" cy="457" r="7" class="green"/><text x="230" y="463" class="small">Payment received</text><rect x="186" y="508" width="242" height="42" rx="14" fill="#f8fafc" stroke="#dbe3de"/><circle cx="210" cy="529" r="7" class="green"/><text x="230" y="535" class="small">Medication note</text><rect x="186" y="580" width="242" height="42" rx="14" fill="#f8fafc" stroke="#dbe3de"/><circle cx="210" cy="601" r="7" class="green"/><text x="230" y="607" class="small">Roster updated</text>
    <path d="M518 486H664" stroke="#10b981" stroke-width="8" stroke-linecap="round"/><path d="M640 462l28 24-28 24" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="704" y="286" width="350" height="360" rx="34" fill="#07111f" filter="url(#shadow)"/>
