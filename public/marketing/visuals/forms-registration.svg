    <circle cx="770" cy="420" r="14" fill="#10b981"/><text x="804" y="427" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="700" fill="#d1d5db">Teacher</text><circle cx="770" cy="488" r="14" fill="#10b981"/><text x="804" y="495" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="700" fill="#d1d5db">Office</text><circle cx="770" cy="556" r="14" fill="#10b981"/><text x="804" y="563" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="700" fill="#d1d5db">Finance</text>
