      .green{fill:#10b981}
      .blue{fill:#2563eb}
      .amber{fill:#f59e0b}
      .red{fill:#ef4444}
    </style>
  </defs>
    <rect width="1200" height="900" rx="56" fill="#f3f6f4"/>
    <rect width="1200" height="900" fill="url(#grid)" opacity="0.55"/>
    <rect x="72" y="70" width="1056" height="760" rx="44" fill="#fbfcfb" stroke="#dbe3de"/>
    
    <text x="120" y="134" class="label">IT support</text><text x="120" y="174" class="title">Tickets with device context</text>
