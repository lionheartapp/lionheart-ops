    <rect x="72" y="70" width="1056" height="760" rx="44" fill="#fbfcfb" stroke="#dbe3de"/>
    
    <text x="120" y="134" class="label">Messaging</text><text x="120" y="174" class="title">Conversation attached to the work</text>
